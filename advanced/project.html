<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Project — VK Engineers, Inc.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="images/favicon.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="site-header" id="site-header"></header>

<!-- This page has no static content — js/script.js reads the ?slug= from
     the URL, finds the matching entry in js/projects-data.js, and fills
     everything in below. -->
<section class="page-intro">
  <div class="container">
    <a href="projects.html" class="back-link">&larr; All Projects</a>
    <span class="eyebrow" id="project-discipline">Project</span>
    <h1 id="project-name">Loading&hellip;</h1>
    <p class="page-intro-lead" id="project-location"></p>
  </div>
</section>

<section class="section-alt">
  <div class="container">
    <div class="project-detail-grid">
      <div>
        <div class="photo-placeholder tall" id="project-actual-photo"><span>Photograph</span></div>
        <div class="photo-placeholder tall" id="project-render-photo" style="margin-top:20px;"><span>Render</span></div>
      </div>
      <div>
        <div class="project-meta-list" id="project-meta"></div>
        <h3 style="margin-top:32px;">About This Project</h3>
        <p id="project-description" class="about-intro"></p>
      </div>
    </div>
  </div>
</section>

<section>
  <div class="container" style="text-align:center;">
    <h2>Have a similar project in mind?</h2>
    <p class="page-intro-lead" style="margin:14px auto 28px;">Tell us about it and we'll follow up within one business day.</p>
    <a href="contact.html" class="btn btn-primary">Start a Conversation</a>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/projects-data.js"></script>
<script src="js/partials.js"></script>
<script src="js/script.js"></script>
</body>
</html>
